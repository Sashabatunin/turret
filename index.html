<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Turret Controller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Automatic Turret</h1>
  <div id="status">Initialising…</div>

  <div class="video-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="controls">
    <button id="btnFace">🎯 Start Face Tracking</button>
    <button id="btnCustom" disabled>🖌️ Custom Object (draw box)</button>
    <button id="btnStop" disabled>⏹ Stop Tracking</button>
  </div>

  <div id="mqtt-state">MQTT: disconnected</div>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
