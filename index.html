<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трансляция с камеры</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .video-container {
            position: relative;
            background: #111;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(100, 100, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
            max-width: 90vw;
            min-width: 320px;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            display: block;
            width: 640px;
            max-width: 100%;
            height: auto;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            padding: 12px 28px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-stop {
            background: #ff1744;
            color: #fff;
        }

        .btn-stop:hover {
            background: #ff5252;
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.5);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status {
            margin-top: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .status.active {
            background: rgba(0, 200, 83, 0.3);
            color: #69f0ae;
        }

        .status.inactive {
            background: rgba(255, 23, 68, 0.3);
            color: #ff8a80;
        }

        .error-msg {
            margin-top: 15px;
            color: #ff8a80;
            background: rgba(255, 23, 68, 0.15);
            padding: 12px 20px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }
        
        /* Заглушка, пока камера не включилась */
        .placeholder {
            color: #888;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <h1>📷 Трансляция с камеры</h1>

    <div class="video-container">
        <div class="placeholder" id="placeholder">Загрузка...</div>
        <video id="video" autoplay playsinline muted style="display: none;"></video>
    </div>

    <div class="controls">
        <button class="btn-stop" id="btnStop" onclick="stopCamera()" disabled>⏹ Выключить камеру</button>
    </div>

    <div class="status inactive" id="status">Ожидание доступа...</div>
    <div class="error-msg" id="errorMsg"></div>

    <script>
        let stream = null;

        const video      = document.getElementById('video');
        const btnStop    = document.getElementById('btnStop');
        const status     = document.getElementById('status');
        const errorMsg   = document.getElementById('errorMsg');
        const placeholder = document.getElementById('placeholder');

        // Автоматический запуск при загрузке страницы
        window.addEventListener('DOMContentLoaded', startCamera);

        async function startCamera() {
            errorMsg.style.display = 'none';
            status.textContent = 'Запрос доступа к камере...';

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width:  { ideal: 1280 },
                        height: { ideal: 720  },
                        facingMode: 'user'
                    },
                    audio: false
                });

                // Если доступ получен
                video.srcObject = stream;
                video.play();

                video.style.display = 'block';
                placeholder.style.display = 'none';

                btnStop.disabled = false;
                status.textContent = '🟢 Камера активна';
                status.className   = 'status active';

            } catch (err) {
                console.error('Ошибка:', err);
                placeholder.textContent = 'Нет сигнала';
                
                // Обработка ошибок доступа
                if (err.name === 'NotAllowedError') {
                    errorMsg.textContent = '⚠ Вы запретили доступ к камере. Разрешите доступ в настройках браузера и обновите страницу.';
                } else if (err.name === 'NotFoundError') {
                    errorMsg.textContent = '⚠ Камера не найдена на устройстве.';
                } else {
                    errorMsg.textContent = `⚠ Ошибка: ${err.message}`;
                }
                errorMsg.style.display = 'block';
                status.textContent = 'Камера выключена';
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                stream = null;
            }

            video.style.display = 'none';
            placeholder.style.display = 'block';
            placeholder.textContent = 'Камера выключена';

            btnStop.disabled = true;
            status.textContent = 'Камера выключена';
            status.className   = 'status inactive';
            
            // Кнопка превращается в "Включить" для перезапуска
            btnStop.textContent = '▶ Включить камеру';
            btnStop.style.background = '#00c853';
            btnStop.onclick = restartCamera;
        }

        function restartCamera() {
            btnStop.textContent = '⏹ Выключить камеру';
            btnStop.style.background = '#ff1744';
            btnStop.onclick = stopCamera;
            startCamera();
        }
    </script>

</body>
</html>
