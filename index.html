<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СУ макетом автоматической турели</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран подключения -->
    <div id="connection-screen">
        <h1>Подключение к системе</h1>
        <form id="connect-form">
            <label>MQTT Брокер (ws://): <input type="text" id="broker-url" value="ws://broker.hivemq.com:8000/mqtt" required></label>
            <label>Логин: <input type="text" id="username" placeholder="admin (опционально)"></label>
            <label>Пароль: <input type="password" id="password"></label>
            <button type="submit">Подключиться</button>
        </form>
        <p id="connection-status">Ожидание ввода данных...</p>
    </div>

    <!-- Основной дашборд -->
    <div id="dashboard" class="hidden">
        <header>
            <div id="header-status">OFFLINE</div>
            <div id="header-broker">-</div>
            <button id="logout-btn">Выход</button>
        </header>

        <main class="dashboard-grid">
            <section class="video-section">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="overlay-canvas"></canvas>
                <div id="cv-loading" class="hidden">⏳ Загрузка нейросетевой модели CV...</div>
            </section>

            <aside class="control-panel">
                <div class="mode-switch">
                    <label><input type="radio" name="mode" value="manual" checked> Ручной</label>
                    <label><input type="radio" name="mode" value="auto"> Автоматический</label>
                </div>

                <div id="manual-controls">
                    <label>Азимут (0-180°): <input type="range" id="azimuth-slider" min="0" max="180" value="90"><span id="azimuth-val">90</span>°</label>
                    <label>Угол места (0-180°): <input type="range" id="elevation-slider" min="0" max="180" value="90"><span id="elevation-val">90</span>°</label>
                    <label>Скорость (1-100%): <input type="range" id="speed-slider" min="1" max="100" value="50"><span id="speed-val">50</span>%</label>
                </div>

                <div class="emergency-controls">
                    <button id="stop-btn" class="btn-danger">🛑 STOP</button>
                    <button id="home-btn" class="btn-warning">🏠 HOME</button>
                </div>
            </aside>

            <section class="telemetry-section">
                <h3>📊 Телеметрия</h3>
                <div id="telemetry-data">
                    <p>Текущий азимут: <span id="tel-az">-</span>°</p>
                    <p>Текущий угол места: <span id="tel-el">-</span>°</p>
                    <p>Целевой азимут: <span id="target-az">-</span>°</p>
                    <p>Целевой угол места: <span id="target-el">-</span>°</p>
                    <p>Статус: <span id="tel-status">-</span></p>
                    <p>Уверенность CV: <span id="tel-conf">-</span>%</p>
                </div>
            </section>

            <section class="log-section">
                <h3>📜 Журнал событий</h3>
                <div id="event-log" class="log-container"></div>
                <button id="clear-log" class="btn-small">Очистить</button>
            </section>
        </main>
    </div>

    <!-- Подключение библиотек -->
    <script src="https://unpkg.com/paho-mqtt@1.1.0/mqttws31.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
